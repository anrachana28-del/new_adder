<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Telegram PRO MAX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">

<style>
/* ====== (KEEP YOUR ORIGINAL CSS - unchanged) ====== */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'JetBrains Mono', monospace;
background:linear-gradient(135deg,#07111f,#091d2d,#10293b);color:#fff;}
.app{width:100%;height:100vh;display:flex;}
.sidebar{width:260px;height:100%;background:linear-gradient(180deg,#111827,#0f172a);
border-right:1px solid #1f2937;padding:20px;display:flex;flex-direction:column;gap:15px;}
.logo{font-size:24px;font-weight:700;color:#00ff88;margin-bottom:20px;}
.nav-btn{width:100%;padding:14px;border:none;border-radius:12px;cursor:pointer;
background:#1e293b;color:#fff;transition:0.2s;font-size:14px;font-weight:700;}
.nav-btn:hover{transform:translateY(-2px);background:#334155;}
.nav-btn.active{background:#00ff88;color:#000;}
.main{flex:1;height:100vh;overflow:auto;padding:20px;}
.page{display:none;}
.page.active{display:block;}
.card{width:100%;background:linear-gradient(180deg,rgba(20,20,20,0.95),rgba(15,15,15,0.95));
border:1px solid #1f2937;border-radius:20px;padding:20px;margin-bottom:20px;
box-shadow:0 0 20px rgba(0,0,0,0.4);}
.card-title{font-size:22px;font-weight:700;color:#00ff88;margin-bottom:15px;}
textarea,input,select{
width:100%;background:#111827;border:1px solid #1f2937;color:#fff;
padding:14px;border-radius:12px;margin-top:10px;font-size:14px;outline:none;}
textarea{height:150px;resize:none;}
.primary-btn{width:100%;margin-top:15px;padding:14px;border:none;border-radius:12px;
cursor:pointer;font-size:15px;font-weight:700;color:#000;
background:linear-gradient(90deg,#00ff88,#00d9ff);}
.status-bar{width:100%;padding:15px;border-radius:15px;background:#111827;
margin-top:15px;font-size:14px;font-weight:700;color:#00ff88;}
.log-box{width:100%;height:300px;overflow:auto;background:#000;border-radius:15px;
padding:15px;margin-top:15px;font-size:13px;border:1px solid #1f2937;}
.log-item{margin-bottom:8px;}
</style>
</head>

<body>

<div class="app">

  <div class="sidebar">
    <div class="logo">Telegram PRO</div>

    <button class="nav-btn active" id="btnAdd">Auto Add</button>
    <button class="nav-btn" id="btnAccounts">Accounts</button>
    <button class="nav-btn" id="btnHistory">History</button>
  </div>

  <div class="main">

    <!-- ================= ADD PAGE ================= -->
    <div class="page active" id="pageAdd">

      <div class="card">
        <div class="card-title">Auto Add Members</div>

        <!-- 🔥 NEW MODE SELECT -->
        <select id="inputMode">
          <option value="username">Username (@username)</option>
          <option value="group">Group Link (t.me/...)</option>
        </select>

        <textarea id="source" placeholder="Enter @username OR group link"></textarea>

        <input id="target" placeholder="Target group">

        <button class="primary-btn" id="startBtn">START ADD</button>

        <div class="status-bar" id="statusBar">Ready</div>
      </div>

      <div class="card">
        <div class="card-title">Logs</div>
        <div class="log-box" id="logBox"></div>
      </div>

    </div>

  </div>
</div>

<script>

// ================= LOG =================
const logBox = document.getElementById("logBox");

function log(msg){
  const div = document.createElement("div");
  div.className = "log-item";
  div.textContent = msg;
  logBox.appendChild(div);
  logBox.scrollTop = logBox.scrollHeight;
}

// ================= START =================
document.getElementById("startBtn").onclick = async () => {

  const mode = document.getElementById("inputMode").value;
  const source = document.getElementById("source").value.trim();
  const target = document.getElementById("target").value.trim();

  if(!source || !target){
    alert("Missing data");
    return;
  }

  const statusBar = document.getElementById("statusBar");

  // ================= USERNAME MODE =================
  if(mode === "username"){

    const users = source
      .split("\n")
      .map(v => v.trim())
      .filter(Boolean);

    for(const u of users){

      log("🔄 Adding " + u);
      statusBar.textContent = "Processing " + u;

      try{

        const res = await fetch("/add-member",{
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify({
            type:"username",
            username:u,
            targetGroup:target
          })
        });

        const result = await res.json();
        log("✅ " + u + " → " + result.status);

      }catch(e){
        log("❌ " + u + " ERROR");
      }
    }
  }

  // ================= GROUP MODE =================
  else if(mode === "group"){

    log("📥 Processing group link...");
    statusBar.textContent = "Processing group...";

    try{

      const res = await fetch("/add-member",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
          type:"group",
          groupLink:source,
          targetGroup:target
        })
      });

      const result = await res.json();
      log("📌 Group result → " + result.status);

    }catch(e){
      log("❌ Group ERROR");
    }
  }

  statusBar.textContent = "Done";
};

</script>

</body>
</html>
